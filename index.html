<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Respiratory System Physical Examination — Year 1 Med Game</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Fredoka & Quicksand for the cute study guide theme -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- React & ReactDOM (Production) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background-color: #FDF0F0;
      color: #5A3825;
      margin: 0;
      padding: 0;
    }
    h1, h2, h3, .font-display {
      font-family: 'Fredoka', sans-serif;
    }
    .kawaii-shadow {
      box-shadow: 0 5px 0 #5A3825;
    }
    .kawaii-shadow-sm {
      box-shadow: 0 3px 0 #5A3825;
    }
    .kawaii-card-correct {
      border-color: #68D391 !important;
      background-color: #F0FFF4 !important;
      box-shadow: 0 5px 0 #38A169 !important;
    }
    .kawaii-card-wrong {
      border-color: #9B2C2C !important;
      background-color: #FFF5F5 !important;
      box-shadow: 0 5px 0 #742A2A !important;
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .animate-float {
      animation: floatSlow 3s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ==========================================
    // DEFAULT CLINICAL DATABASE (Mode 1 & Mode 2)
    // ==========================================
    const DEFAULT_FINDINGS = [
      // Inspection
      {
        id: 'insp_asym_left',
        category: 'Inspection',
        title: 'Reduced Left Chest Wall Movement',
        subtitle: 'Asymmetric lag on the left side during inspiration',
        rationale: 'Pathology in the left hemithorax (consolidation or large pleural effusion) restricts ipsilateral lung expansion.'
      },
      {
        id: 'insp_asym_right',
        category: 'Inspection',
        title: 'Reduced Right Chest Wall Movement',
        subtitle: 'Asymmetric lag on the right side with respiratory distress',
        rationale: 'High-pressure air trapped in the right pleural space collapses the right lung and prevents normal chest wall excursion.'
      },
      {
        id: 'insp_hyperinflation',
        category: 'Inspection',
        title: 'Accessory Muscle Use & Hyperinflation',
        subtitle: 'Barrel-shaped chest with sternocleidomastoid / intercostal retractions',
        rationale: 'Severe bronchospasm traps air during expiration, forcing lungs to operate at high volumes and requiring accessory muscles.'
      },
      {
        id: 'insp_tachypnea_sym',
        category: 'Inspection',
        title: 'Tachypnea with Symmetric Movement',
        subtitle: 'Rapid breathing but equal bilateral chest movement',
        rationale: 'Diffuse alveolar fluid impairs gas exchange across both lungs equally, stimulating tachypnea without unilateral asymmetry.'
      },

      // Palpation
      {
        id: 'palp_trachea_midline',
        category: 'Palpation',
        title: 'Normal Midline Trachea',
        subtitle: 'No mediastinal shift (Normal finding)',
        rationale: 'Alveolar consolidation, bilateral pulmonary edema, and asthma do not create unilateral pleural pressure gradients, so the trachea stays midline.'
      },
      {
        id: 'palp_trachea_left',
        category: 'Palpation',
        title: 'Trachea Shift to the Left',
        subtitle: 'Mediastinum pushed toward the left side',
        rationale: 'In a Right Tension Pneumothorax, positive pressure builds up in the right pleural space and pushes the trachea contralaterally to the left.'
      },
      {
        id: 'palp_trachea_right',
        category: 'Palpation',
        title: 'Trachea Shift to the Right',
        subtitle: 'Mediastinum pushed toward the right side',
        rationale: 'In a Massive Left Pleural Effusion, large fluid volume in the left pleural space pushes the mediastinum and trachea away to the right.'
      },
      {
        id: 'palp_exp_dec_left',
        category: 'Palpation',
        title: 'Decreased Left Chest Expansion',
        subtitle: 'Left thumb moves less than right on deep inspiration',
        rationale: 'Left consolidation or massive left effusion reduces compliance and volume entry into the left hemithorax.'
      },
      {
        id: 'palp_exp_dec_right',
        category: 'Palpation',
        title: 'Decreased Right Chest Expansion',
        subtitle: 'Right thumb moves less than left on deep inspiration',
        rationale: 'Right tension pneumothorax collapses the right lung, markedly reducing right-sided expansion.'
      },
      {
        id: 'palp_frem_inc_left',
        category: 'Palpation',
        title: 'Increased Left Tactile Fremitus',
        subtitle: 'Stronger "99" vibrations felt over left lower lung',
        rationale: 'Fluid/exudate-filled alveoli in consolidation conduct low-frequency vocal vibrations much better than air-filled alveoli (provided the bronchus is patent).'
      },
      {
        id: 'palp_frem_dec_left',
        category: 'Palpation',
        title: 'Decreased Left Tactile Fremitus',
        subtitle: 'Dampened or absent vibrations over the left lung',
        rationale: 'Fluid in the pleural space separates the lung parenchyma from the chest wall, creating an acoustic barrier that dampens tactile fremitus.'
      },
      {
        id: 'palp_frem_dec_right',
        category: 'Palpation',
        title: 'Decreased Right Tactile Fremitus',
        subtitle: 'Absent vibrations over the right hemithorax',
        rationale: 'Air trapped in the right pleural space insulates sound transmission from the collapsed right lung to the chest wall.'
      },

      // Percussion
      {
        id: 'perc_dull_left',
        category: 'Percussion',
        title: 'Left Dullness on Percussion',
        subtitle: 'Dull / stony dull note over the left chest',
        rationale: 'Replacing normal air-filled lung with dense alveolar exudate (consolidation) or pleural fluid (effusion) produces a dull or stony dull percussion note.'
      },
      {
        id: 'perc_tympanic_right',
        category: 'Percussion',
        title: 'Right Hyperresonant / Tympanic Percussion',
        subtitle: 'Hollow drum-like sound over the right chest',
        rationale: 'A large pocket of free air under tension in the right pleural cavity vibrates loudly on percussion, creating hyperresonance or tympany.'
      },
      {
        id: 'perc_normal_bilat',
        category: 'Percussion',
        title: 'Normal Resonance on Percussion',
        subtitle: 'Normal resonant note bilaterally (Normal finding)',
        rationale: 'In interstitial/early bilateral pulmonary edema or mild-to-moderate asthma, air remains the predominant medium on percussion.'
      },
      {
        id: 'perc_hyper_bilat',
        category: 'Percussion',
        title: 'Normal / Diffuse Hyperresonance',
        subtitle: 'Bilateral resonant to hyperresonant note across both lungs',
        rationale: 'Diffuse air trapping in severe asthma increases functional residual capacity, keeping percussion normal or bilaterally hyperresonant.'
      },

      // Auscultation
      {
        id: 'ausc_bronchial_left',
        category: 'Auscultation',
        title: 'Left Bronchial Breath Sounds & Crackles',
        subtitle: 'Harsh tubular sounds + coarse crackles over left lower lobe',
        rationale: 'Consolidated lung transmits high-frequency turbulent tracheobronchial sounds directly to the periphery without alveolar air filtering.'
      },
      {
        id: 'ausc_vr_inc_left',
        category: 'Auscultation',
        title: 'Increased Left Vocal Resonance',
        subtitle: 'Loud, clear spoken voice ("99") over left lower lung',
        rationale: 'Solidified alveolar tissue in left lower lobe consolidation enhances transmission of spoken voice sounds through the chest wall.'
      },
      {
        id: 'ausc_absent_right',
        category: 'Auscultation',
        title: 'Absent Breath Sounds on Right',
        subtitle: 'Silent right hemithorax on auscultation',
        rationale: 'In right tension pneumothorax, the right lung is collapsed and pleural air blocks sound transmission.'
      },
      {
        id: 'ausc_vr_dec_right',
        category: 'Auscultation',
        title: 'Decreased Right Vocal Resonance',
        subtitle: 'Muffled or absent voice sounds over right chest',
        rationale: 'Pleural air in right pneumothorax reflects and insulates acoustic energy from the airways.'
      },
      {
        id: 'ausc_dec_left',
        category: 'Auscultation',
        title: 'Decreased / Absent Breath Sounds Left Lung',
        subtitle: 'Diminished breath sounds over the left fluid zone',
        rationale: 'Pleural fluid compresses the underlying left lung and blocks breath sound transmission to the stethoscope.'
      },
      {
        id: 'ausc_vr_dec_left',
        category: 'Auscultation',
        title: 'Decreased Left Vocal Resonance',
        subtitle: 'Muffled spoken voice over the left chest',
        rationale: 'Fluid in the left pleural space acts as an acoustic insulator between the bronchial tree and the stethoscope.'
      },
      {
        id: 'ausc_fine_crep_bilat',
        category: 'Auscultation',
        title: 'Bilateral Fine Late-Inspiratory Crepitations',
        subtitle: 'Fine basal crackles heard symmetrically in both lungs',
        rationale: 'Edema fluid causes small distal airways and alveoli at the lung bases to snap open during late inspiration.'
      },
      {
        id: 'ausc_wheeze_bilat',
        category: 'Auscultation',
        title: 'Bilateral Expiratory Wheezing',
        subtitle: 'High-pitched musical polyphonic wheezes bilaterally',
        rationale: 'Airflow through diffusely narrowed, bronchospastic and edematous small airways creates musical oscillations during expiration.'
      },
      {
        id: 'ausc_silent_chest',
        category: 'Auscultation',
        title: 'Silent Chest (Life-Threatening Asthma)',
        subtitle: 'Critically reduced airflow with absent wheezing',
        rationale: 'When bronchospasm and mucus plugging become critical, airflow velocity drops too low to generate audible wheezes—an ominous sign!'
      }
    ];

    const DEFAULT_DISEASES = [
      {
        id: 'consolidation_lll',
        name: 'Left Lower Lung Consolidation',
        shortTag: 'Alveolar Exudate (Lobar Pneumonia)',
        graphicType: 'consolidation_left',
        customImageUrl: '',
        pathophysiology: 'Alveoli in the left lower lobe fill with inflammatory exudate (fluid, WBCs, fibrin) while the conducting airways remain patent. Solidified parenchyma conducts sound waves and vibrations much better than spongy air-filled alveoli, without shifting the mediastinum.',
        findingIds: [
          'palp_trachea_midline',
          'palp_exp_dec_left',
          'palp_frem_inc_left',
          'perc_dull_left',
          'ausc_bronchial_left',
          'ausc_vr_inc_left'
        ],
        ippaTable: {
          inspection: 'Asymmetric chest wall movement (lag on left) or normal',
          palpation: 'Trachea midline (NORMAL); Decreased left chest expansion; INCREASED left tactile fremitus',
          percussion: 'DULLNESS over left lower lung zone',
          auscultation: 'BRONCHIAL breath sounds & coarse crackles on left; INCREASED left vocal resonance'
        }
      },
      {
        id: 'tension_ptx_right',
        name: 'Right Tension Pneumothorax',
        shortTag: 'One-Way Valve Pleural Air Trapping',
        graphicType: 'pneumothorax_right',
        customImageUrl: '',
        pathophysiology: 'Air enters the right pleural space via a one-way tissue valve and cannot escape. Positive pleural pressure collapses the right lung and pushes the trachea and mediastinum toward the opposite (left) side.',
        findingIds: [
          'palp_trachea_left',
          'palp_exp_dec_right',
          'perc_tympanic_right',
          'ausc_absent_right',
          'ausc_vr_dec_right'
        ],
        ippaTable: {
          inspection: 'Respiratory distress; Asymmetric chest wall movement (reduced on right)',
          palpation: 'Trachea shifted to the LEFT; Decreased right chest expansion; Decreased/absent right tactile fremitus',
          percussion: 'HYPERRESONANT / TYMPANIC over right hemithorax',
          auscultation: 'ABSENT breath sounds on right; Decreased right vocal resonance'
        }
      },
      {
        id: 'effusion_left_massive',
        name: 'Massive Left Pleural Effusion',
        shortTag: 'Large Fluid Collection in Left Pleural Space',
        graphicType: 'effusion_left',
        customImageUrl: '',
        pathophysiology: 'A large volume of fluid accumulates in the left pleural space, compressing the left lung, pushing the trachea/mediastinum to the right, and insulating sound/vibration transmission through the left chest wall.',
        findingIds: [
          'palp_trachea_right',
          'palp_exp_dec_left',
          'perc_dull_left',
          'ausc_dec_left',
          'ausc_vr_dec_left'
        ],
        ippaTable: {
          inspection: 'Asymmetric chest wall movement (reduced on left)',
          palpation: 'Trachea shifted to the RIGHT; Decreased left chest expansion; Decreased/absent left tactile fremitus',
          percussion: 'STONY DULLNESS over left hemithorax',
          auscultation: 'DECREASED or ABSENT breath sounds on left; Decreased left vocal resonance'
        }
      },
      {
        id: 'pulm_edema_bilat',
        name: 'Bilateral Pulmonary Edema',
        shortTag: 'Cardiogenic / Alveolar-Interstitial Fluid',
        graphicType: 'edema_bilat',
        customImageUrl: '',
        pathophysiology: 'Elevated pulmonary capillary hydrostatic pressure pushes transudative fluid into the interstitial space and basal alveoli bilaterally. Because air still fills most of the upper/mid lung volume, trachea and percussion often remain normal while basal alveoli snap open with fine crackles.',
        findingIds: [
          'palp_trachea_midline',
          'perc_normal_bilat',
          'ausc_fine_crep_bilat'
        ],
        ippaTable: {
          inspection: 'Tachypnea; Symmetrical chest wall movement (NORMAL symmetry)',
          palpation: 'Trachea midline (NORMAL); Normal bilateral chest expansion & tactile fremitus (NORMAL)',
          percussion: 'NORMAL resonance bilaterally (note: findings in disease can still be normal!)',
          auscultation: 'BILATERAL FINE LATE-INSPIRATORY CREPITATIONS (crackles) at lung bases; Normal vocal resonance'
        }
      },
      {
        id: 'asthma_severe',
        name: 'Severe Asthmatic Attack',
        shortTag: 'Diffuse Bronchospasm & Airway Inflammation',
        graphicType: 'asthma_severe',
        customImageUrl: '',
        pathophysiology: 'Bronchial smooth muscle constriction, mucosal edema, and mucus plugging narrow the small airways diffusely. Expiration is prolonged with polyphonic wheezing and hyperinflation—or a "silent chest" if airflow becomes critically obstructed.',
        findingIds: [
          'insp_hyperinflation',
          'perc_hyper_bilat',
          'ausc_wheeze_bilat',
          'ausc_silent_chest'
        ],
        ippaTable: {
          inspection: 'ACCESSORY MUSCLE USE & hyperinflated chest (barrel-shaped)',
          palpation: 'Trachea midline (NORMAL); Symmetrically decreased chest expansion & tactile fremitus',
          percussion: 'NORMAL to HYPERRESONANT bilaterally',
          auscultation: 'BILATERAL EXPIRATORY WHEEZING (or SILENT CHEST if life-threatening); Normal/decreased vocal resonance'
        }
      }
    ];

    // ==========================================
    // CATEGORY ICONS (Finger for Percussion, Stethoscope for Auscultation, etc.)
    // ==========================================
    function CategoryIcon({ category, size = 44 }) {
      if (category === 'Percussion') {
        return (
          <svg width={size} height={size} viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="28" fill="#FFE4E6" stroke="#5A3825" strokeWidth="3" />
            {/* Tapping waves */}
            <path d="M20 18C24 14 40 14 44 18" stroke="#C85A5A" strokeWidth="2.5" strokeLinecap="round" strokeDasharray="3 3" />
            <circle cx="32" cy="22" r="4" fill="#F6AD55" />
            {/* Cute Percussion Finger */}
            <path d="M27 25C27 21.5 37 21.5 37 25V41H42C44.5 41 46 43 46 45.5V48C46 51.5 43 54 39.5 54H25.5C22 54 19 51 19 47.5V39C19 36.5 22 36.5 24 38V28C24 26 25.5 25 27 25Z" fill="#FAD2B8" stroke="#5A3825" strokeWidth="3" strokeLinejoin="round" />
            <rect x="29" y="23" width="6" height="5" rx="2.5" fill="#FFF5F5" stroke="#5A3825" strokeWidth="2" />
          </svg>
        );
      }
      if (category === 'Auscultation') {
        return (
          <svg width={size} height={size} viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="28" fill="#E6FFFA" stroke="#5A3825" strokeWidth="3" />
            {/* Stethoscope */}
            <path d="M20 16V26C20 33 25 38 32 38C39 38 44 33 44 26V16" stroke="#5A3825" strokeWidth="3.5" strokeLinecap="round" />
            <circle cx="20" cy="15" r="3" fill="#C85A5A" stroke="#5A3825" strokeWidth="2" />
            <circle cx="44" cy="15" r="3" fill="#C85A5A" stroke="#5A3825" strokeWidth="2" />
            <path d="M32 38V46C32 50 37 51 41 48" stroke="#5A3825" strokeWidth="3.5" strokeLinecap="round" />
            <circle cx="45" cy="45" r="6" fill="#F687B3" stroke="#5A3825" strokeWidth="3" />
            <circle cx="45" cy="45" r="2.5" fill="#FFFDF9" />
          </svg>
        );
      }
      if (category === 'Palpation') {
        return (
          <svg width={size} height={size} viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="28" fill="#FEFCBF" stroke="#5A3825" strokeWidth="3" />
            {/* Cute Open Hand */}
            <path d="M22 35V22C22 20 25 20 25 22V31M26 31V18C26 16 30 16 30 18V31M31 31V17C31 15 35 15 35 17V31M36 31V20C36 18 40 18 40 20V36C40 36 44 32 46 34C48 36 44 42 41 46C38 49 34 51 29 51C23 51 20 46 20 40V33C20 31 22 31 22 35Z" fill="#FAD2B8" stroke="#5A3825" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round" />
            <circle cx="27" cy="41" r="1.5" fill="#5A3825" />
            <circle cx="34" cy="41" r="1.5" fill="#5A3825" />
            <path d="M29 44C30 45 31 45 32 44" stroke="#5A3825" strokeWidth="2" strokeLinecap="round" />
          </svg>
        );
      }
      // Inspection
      return (
        <svg width={size} height={size} viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="28" fill="#E9D8FD" stroke="#5A3825" strokeWidth="3" />
          <path d="M14 32C18 22 25 19 32 19C39 19 46 22 50 32C46 42 39 45 32 45C25 45 18 42 14 32Z" fill="#FFFDF9" stroke="#5A3825" strokeWidth="3" strokeLinejoin="round" />
          <circle cx="32" cy="32" r="7" fill="#5A3825" />
          <circle cx="34" cy="29" r="2.5" fill="#FFFDF9" />
        </svg>
      );
    }

    // ==========================================
    // KAWAII PATHOLOGY LUNG GRAPHICS
    // ==========================================
    function LungPathologyGraphic({ type, customImageUrl, mystery = false, size = 'large' }) {
      if (!mystery && customImageUrl && customImageUrl.trim() !== '') {
        return (
          <div className="w-full h-full flex items-center justify-center p-2">
            <img
              src={customImageUrl}
              alt="Disease diagram"
              className="max-h-56 object-contain rounded-2xl border-2 border-[#5A3825]"
            />
          </div>
        );
      }

      // Trachea shift offsets (Standard anatomical view: Left side of diagram is Right Lung, Right side is Left Lung)
      const tracheaShift =
        mystery ? 0 :
        type === 'pneumothorax_right' ? 12 : // shifts toward patient's left (viewer's right)
        type === 'effusion_left' ? -12 : // shifts toward patient's right (viewer's left)
        0;

      const svgHeight = size === 'small' ? 150 : 240;

      return (
        <div className="relative flex flex-col items-center justify-center w-full">
          {/* Anatomical orientation labels */}
          <div className="flex justify-between w-full px-4 text-xs font-bold text-[#8C584C] mb-1">
            <span className="bg-[#FFE4E6] px-2 py-0.5 rounded-full border border-[#5A3825]">Patient's RIGHT</span>
            <span className="bg-[#FFE4E6] px-2 py-0.5 rounded-full border border-[#5A3825]">Patient's LEFT</span>
          </div>

          <svg
            viewBox="0 0 260 210"
            className="w-full"
            style={{ maxHeight: svgHeight }}
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            {/* Background Pleural Cavity Outlines */}
            {/* Right Pleural Cavity (Viewer Left) */}
            <path
              d="M115 58 C82 55, 42 80, 38 140 C36 172, 60 185, 112 175 C118 173, 120 155, 118 115 Z"
              fill={!mystery && type === 'pneumothorax_right' ? '#E2F1FF' : '#FFF5F5'}
              stroke="#5A3825"
              strokeWidth="3.5"
              strokeDasharray={!mystery && type === 'pneumothorax_right' ? '5 3' : 'none'}
            />

            {/* Left Pleural Cavity (Viewer Right) */}
            <path
              d="M145 58 C178 55, 218 80, 222 140 C224 172, 200 185, 148 175 C142 173, 140 155, 142 115 Z"
              fill={!mystery && type === 'effusion_left' ? '#BEE3F8' : '#FFF5F5'}
              stroke="#5A3825"
              strokeWidth="3.5"
            />

            {/* Trachea & Cartilage Rings */}
            <g transform={`translate(${tracheaShift}, 0)`}>
              <rect x="120" y="12" width="20" height="54" rx="6" fill="#F6C29F" stroke="#5A3825" strokeWidth="3.5" />
              <line x1="122" y1="22" x2="138" y2="22" stroke="#D68C65" strokeWidth="3" />
              <line x1="122" y1="32" x2="138" y2="32" stroke="#D68C65" strokeWidth="3" />
              <line x1="122" y1="42" x2="138" y2="42" stroke="#D68C65" strokeWidth="3" />
              <line x1="122" y1="52" x2="138" y2="52" stroke="#D68C65" strokeWidth="3" />
              {/* Bronchi */}
              <path d="M125 63 L100 84" stroke="#5A3825" strokeWidth="8" strokeLinecap="round" />
              <path d="M135 63 L160 84" stroke="#5A3825" strokeWidth="8" strokeLinecap="round" />
              <path d="M125 63 L100 84" stroke="#F6C29F" strokeWidth="4" strokeLinecap="round" />
              <path d="M135 63 L160 84" stroke="#F6C29F" strokeWidth="4" strokeLinecap="round" />
            </g>

            {/* Trachea Shift Arrow Indicator */}
            {!mystery && tracheaShift !== 0 && (
              <g>
                <path
                  d={tracheaShift > 0 ? "M95 28 L118 28" : "M165 28 L142 28"}
                  stroke="#E53E3E"
                  strokeWidth="3.5"
                  strokeLinecap="round"
                />
                <polygon
                  points={tracheaShift > 0 ? "118,23 126,28 118,33" : "142,23 134,28 142,33"}
                  fill="#E53E3E"
                />
              </g>
            )}

            {/* PATIENT'S RIGHT LUNG (Viewer Left) */}
            {!mystery && type === 'pneumothorax_right' ? (
              <g>
                {/* Collapsed Right Lung */}
                <path
                  d="M114 82 C96 82, 82 98, 80 128 C79 145, 92 152, 112 146 Z"
                  fill="#E5989B"
                  stroke="#5A3825"
                  strokeWidth="3.5"
                />
                {/* Trapped Air Labels & Pressure Arrows */}
                <text x="48" y="105" fill="#2B6CB0" fontSize="11" fontWeight="bold">AIR ++</text>
                <path d="M58 115 L75 118" stroke="#2B6CB0" strokeWidth="2.5" strokeLinecap="round" />
                <path d="M55 140 L75 135" stroke="#2B6CB0" strokeWidth="2.5" strokeLinecap="round" />
                {/* Cute dizzy face on collapsed lung */}
                <text x="90" y="122" fill="#5A3825" fontSize="11" fontWeight="bold">x_x</text>
              </g>
            ) : (
              <g>
                {/* Normal or Hyperinflated Right Lung */}
                <path
                  d={
                    !mystery && type === 'asthma_severe'
                      ? "M116 55 C80 50, 35 78, 33 144 C31 178, 58 190, 114 178 Z"
                      : "M115 62 C85 60, 46 84, 43 138 C41 168, 63 180, 111 170 Z"
                  }
                  fill="#F4A29E"
                  stroke="#5A3825"
                  strokeWidth="3.5"
                />
                {/* Cute Face on Right Lung */}
                <circle cx="72" cy="118" r="3.5" fill="#5A3825" />
                <circle cx="94" cy="118" r="3.5" fill="#5A3825" />
                <circle cx="66" cy="124" r="4.5" fill="#E57373" opacity="0.6" />

    // ==========================================
    // MAIN APPLICATION COMPONENT
    // ==========================================
    function App() {
      // Load saved database from localStorage if available
      const [diseases, setDiseases] = useState(() => {
        try {
          const saved = localStorage.getItem('resp_pe_diseases_v2');
          return saved ? JSON.parse(saved) : DEFAULT_DISEASES;
        } catch (e) {
          return DEFAULT_DISEASES;
        }
      });

      const [findings, setFindings] = useState(() => {
        try {
          const saved = localStorage.getItem('resp_pe_findings_v2');
          return saved ? JSON.parse(saved) : DEFAULT_FINDINGS;
        } catch (e) {
          return DEFAULT_FINDINGS;
        }
      });

      // Save to localStorage whenever modified in Professor Mode
      useEffect(() => {
        try {
          localStorage.setItem('resp_pe_diseases_v2', JSON.stringify(diseases));
          localStorage.setItem('resp_pe_findings_v2', JSON.stringify(findings));
        } catch (e) {}
      }, [diseases, findings]);

      // Game Mode ('mode1' = Disease -> Findings, 'mode2' = IPPA Table -> Disease)
      const [gameMode, setGameMode] = useState('mode1');
      const [score, setScore] = useState(0);

      // Mode 1 States
      const [currentDiseaseIndex, setCurrentDiseaseIndex] = useState(null);
      const [presentedFindings, setPresentedFindings] = useState([]);
      const [selectedFindingIds, setSelectedFindingIds] = useState([]);
      const [activeFeedback, setActiveFeedback] = useState(null);

      // Mode 2 States
      const [mode2CaseIndex, setMode2CaseIndex] = useState(0);
      const [stepByStepIppa, setStepByStepIppa] = useState(true);
      const [revealedSteps, setRevealedSteps] = useState({
        inspection: true,
        palpation: false,
        percussion: false,
        auscultation: false
      });
      const [guessedDiseaseIds, setGuessedDiseaseIds] = useState([]);
      const [mode2Feedback, setMode2Feedback] = useState(null);

      // Professor Mode Modal States
      const [showProfModal, setShowProfModal] = useState(false);
      const [profUnlocked, setProfUnlocked] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [profTab, setProfTab] = useState('diseases');
      const [editingDiseaseId, setEditingDiseaseId] = useState(diseases[0]?.id || '');

      // New Finding Form State
      const [newFinding, setNewFinding] = useState({
        category: 'Auscultation',
        title: '',
        subtitle: '',
        rationale: ''
      });

      // New Disease Form State
      const [newDiseaseName, setNewDiseaseName] = useState('');

      // Helper to shuffle an array
      const shuffleArray = (arr) => {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      };

      // Build the 9-card grid for Mode 1 whenever a disease is drawn
      const setupMode1Cards = (diseaseObj) => {
        if (!diseaseObj) return;
        const correctCards = findings.filter((f) => diseaseObj.findingIds.includes(f.id));
        const distractorPool = findings.filter((f) => !diseaseObj.findingIds.includes(f.id));
        const targetCount = Math.max(9, correctCards.length + 3);
        const neededDistractors = Math.max(0, targetCount - correctCards.length);
        const chosenDistractors = shuffleArray(distractorPool).slice(0, neededDistractors);
        const combined = shuffleArray([...correctCards, ...chosenDistractors]);
        setPresentedFindings(combined);
        setSelectedFindingIds([]);
        setActiveFeedback(null);
      };

      // Draw a new disease card in Mode 1
      const handleDrawDiseaseCard = (forcedIndex = null) => {
        if (diseases.length === 0) return;
        let nextIdx;
        if (forcedIndex !== null) {
          nextIdx = forcedIndex;
        } else if (currentDiseaseIndex === null) {
          nextIdx = 0;
        } else {
          nextIdx = (currentDiseaseIndex + 1) % diseases.length;
        }
        setCurrentDiseaseIndex(nextIdx);
        setupMode1Cards(diseases[nextIdx]);
      };

      // Select a finding card in Mode 1
      const handleSelectFinding = (finding) => {
        if (currentDiseaseIndex === null) return;
        if (selectedFindingIds.includes(finding.id)) {
          setActiveFeedback({
            finding,
            isCorrect: diseases[currentDiseaseIndex].findingIds.includes(finding.id)
          });
          return;
        }

        const currentDisease = diseases[currentDiseaseIndex];
        const isCorrect = currentDisease.findingIds.includes(finding.id);
        setSelectedFindingIds((prev) => [...prev, finding.id]);
        setScore((prev) => (isCorrect ? prev + 1 : prev - 1));
        setActiveFeedback({ finding, isCorrect });
      };

      // Mode 1 progress calculation
      const currentDisease = currentDiseaseIndex !== null ? diseases[currentDiseaseIndex] : null;
      const correctSelectedCount = useMemo(() => {
        if (!currentDisease) return 0;
        return selectedFindingIds.filter((id) => currentDisease.findingIds.includes(id)).length;
      }, [currentDisease, selectedFindingIds]);

      const totalCorrectForCurrent = currentDisease ? currentDisease.findingIds.length : 0;
      const isMode1RoundComplete = currentDisease && totalCorrectForCurrent > 0 && correctSelectedCount === totalCorrectForCurrent;

      // Mode 2 handlers
      const currentMode2Case = diseases[mode2CaseIndex] || diseases[0];

      const startMode2Case = (idx) => {
        const nextIdx = typeof idx === 'number' ? idx : (mode2CaseIndex + 1) % diseases.length;
        setMode2CaseIndex(nextIdx);
        setGuessedDiseaseIds([]);
        setMode2Feedback(null);
        setRevealedSteps(
          stepByStepIppa
            ? { inspection: true, palpation: false, percussion: false, auscultation: false }
            : { inspection: true, palpation: true, percussion: true, auscultation: true }
        );
      };

      const toggleStepByStepMode = (useSteps) => {
        setStepByStepIppa(useSteps);
        setRevealedSteps(
          useSteps
            ? { inspection: true, palpation: false, percussion: false, auscultation: false }
            : { inspection: true, palpation: true, percussion: true, auscultation: true }
        );
      };

      const handleGuessDiseaseMode2 = (disease) => {
        if (guessedDiseaseIds.includes(disease.id)) {
          setMode2Feedback({
            disease,
            isCorrect: disease.id === currentMode2Case.id
          });
          return;
        }
        const isCorrect = disease.id === currentMode2Case.id;
        setGuessedDiseaseIds((prev) => [...prev, disease.id]);
        setScore((prev) => (isCorrect ? prev + 1 : prev - 1));
        setMode2Feedback({ disease, isCorrect });
        if (isCorrect) {
          setRevealedSteps({ inspection: true, palpation: true, percussion: true, auscultation: true });
        }
      };

      // Full game reset
      const handleResetGame = () => {
        setScore(0);
        setSelectedFindingIds([]);
        setActiveFeedback(null);
        if (currentDiseaseIndex !== null) {
          setupMode1Cards(diseases[currentDiseaseIndex]);
        }
        setGuessedDiseaseIds([]);
        setMode2Feedback(null);
        setRevealedSteps(
          stepByStepIppa
            ? { inspection: true, palpation: false, percussion: false, auscultation: false }
            : { inspection: true, palpation: true, percussion: true, auscultation: true }
        );
      };

      // Professor Mode helpers
      const editingDisease = diseases.find((d) => d.id === editingDiseaseId) || diseases[0];

      const handleToggleFindingForDisease = (diseaseId, findingId) => {
        setDiseases((prev) =>
          prev.map((d) => {
            if (d.id !== diseaseId) return d;
            const exists = d.findingIds.includes(findingId);
            const nextIds = exists
              ? d.findingIds.filter((id) => id !== findingId)
              : [...d.findingIds, findingId];
            return { ...d, findingIds: nextIds };
          })
        );
      };

      const handleUpdateDiseaseField = (diseaseId, field, value) => {
        setDiseases((prev) =>
          prev.map((d) => (d.id === diseaseId ? { ...d, [field]: value } : d))
        );
      };

      const handleUpdateIppaField = (diseaseId, step, value) => {
        setDiseases((prev) =>
          prev.map((d) =>
            d.id === diseaseId
              ? { ...d, ippaTable: { ...d.ippaTable, [step]: value } }
              : d
          )
        );
      };

      const handleImageFileUpload = (diseaseId, e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          handleUpdateDiseaseField(diseaseId, 'customImageUrl', reader.result);
        };
        reader.readAsDataURL(file);
      };

      const handleAddFinding = (e) => {
        e.preventDefault();
        if (!newFinding.title.trim()) return;
        const created = {
          id: 'custom_f_' + Date.now(),
          category: newFinding.category,
          title: newFinding.title.trim(),
          subtitle: newFinding.subtitle.trim() || 'Physical examination finding',
          rationale: newFinding.rationale.trim() || 'Clinical correlation for this physical sign.'
        };
        setFindings((prev) => [...prev, created]);
        setNewFinding({ category: 'Auscultation', title: '', subtitle: '', rationale: '' });
      };

      const handleAddNewDisease = (e) => {
        e.preventDefault();
        if (!newDiseaseName.trim()) return;
        const newId = 'disease_' + Date.now();
        const created = {
          id: newId,
          name: newDiseaseName.trim(),
          shortTag: 'Custom Respiratory Case',
          graphicType: 'consolidation_left',
          customImageUrl: '',
          pathophysiology: 'Describe the underlying pathophysiology and why these physical findings occur.',
          findingIds: ['palp_trachea_midline'],
          ippaTable: {
            inspection: 'Normal or asymmetric chest wall movement',
            palpation: 'Trachea midline (NORMAL); Tactile fremitus findings',
            percussion: 'Resonant or dull percussion note',
            auscultation: 'Breath sounds and vocal resonance findings'
          }
        };
        setDiseases((prev) => [...prev, created]);
        setEditingDiseaseId(newId);
        setNewDiseaseName('');
      };

      const handleExportJson = () => {
        const payload = JSON.stringify({ diseases, findings }, null, 2);
        const blob = new Blob([payload], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'respiratory-exam-game-data.json';
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImportJson = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            if (Array.isArray(parsed.diseases) && Array.isArray(parsed.findings)) {
              setDiseases(parsed.diseases);
              setFindings(parsed.findings);
              alert('Successfully imported clinical database!');
            }
          } catch (err) {
            alert('Invalid JSON file.');
          }
        };
        reader.readAsText(file);
      };

      const handleRestoreFactoryDefaults = () => {
        if (window.confirm('Restore factory default diseases and findings?')) {
          setDiseases(DEFAULT_DISEASES);
          setFindings(DEFAULT_FINDINGS);
          localStorage.removeItem('resp_pe_diseases_v2');
          localStorage.removeItem('resp_pe_findings_v2');
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between p-3 md:p-6 select-none">
          {/* TOP HEADER BAR */}
          <header className="max-w-7xl w-full mx-auto bg-[#FFFDF9] border-4 border-[#5A3825] rounded-3xl p-4 md:p-5 kawaii-shadow mb-5">
            <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
              {/* Left: Title & Subtitle */}
              <div className="flex items-center gap-3.5">
                <div className="w-14 h-14 rounded-2xl bg-[#FAD2CC] border-3 border-[#5A3825] flex items-center justify-center text-3xl shrink-0 kawaii-shadow-sm">
                  🫁
                </div>
                <div>
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="text-xs font-bold uppercase tracking-wider bg-[#FFE4E6] text-[#C85A5A] px-2.5 py-0.5 rounded-full border border-[#5A3825]">
                      Year 1 Medical Physiology & Physical Exam
                    </span>
                  </div>
                  <h1 className="text-2xl md:text-3xl font-bold text-[#C85A5A] tracking-tight mt-0.5">
                    Respiratory System Physical Examination
                  </h1>
                </div>
              </div>

              {/* Center: Mode Switcher */}
              <div className="flex bg-[#FDF0F0] p-1.5 rounded-2xl border-2 border-[#5A3825] self-start lg:self-auto">
                <button
                  onClick={() => setGameMode('mode1')}
                  className={`px-3.5 py-2 rounded-xl text-sm font-bold transition-all ${
                    gameMode === 'mode1'
                      ? 'bg-[#C85A5A] text-white shadow-sm'
                      : 'text-[#5A3825] hover:bg-[#FAD2CC]/50'
                  }`}
                >
                  🃏 Mode 1: Match Findings
                </button>
                <button
                  onClick={() => setGameMode('mode2')}
                  className={`px-3.5 py-2 rounded-xl text-sm font-bold transition-all ${
                    gameMode === 'mode2'
                      ? 'bg-[#C85A5A] text-white shadow-sm'
                      : 'text-[#5A3825] hover:bg-[#FAD2CC]/50'
                  }`}
                >
                  🩺 Mode 2: IPPA Table ➔ Disease
                </button>
              </div>

              {/* Top Right: Score Counter, Reset Button & Professor Backdoor */}
              <div className="flex items-center gap-2.5 self-end lg:self-auto">
                <div className="bg-[#FFE4E6] border-3 border-[#5A3825] rounded-2xl px-4 py-1.5 flex items-center gap-2 kawaii-shadow-sm">
                  <span className="text-xs font-bold uppercase text-[#8C584C]">Score</span>
                  <span className={`text-2xl font-bold font-display ${score >= 0 ? 'text-[#2F855A]' : 'text-[#9B2C2C]'}`}>
                    {score > 0 ? `+${score}` : score}
                  </span>
                </div>

                <button
                  onClick={handleResetGame}
                  className="bg-[#FFF5F5] hover:bg-[#FED7D7] active:translate-y-0.5 text-[#5A3825] font-bold text-sm px-3.5 py-2.5 rounded-2xl border-3 border-[#5A3825] kawaii-shadow-sm transition"
                  title="Reset Score & Current Round"
                >
                  🔄 Reset
                </button>

                <button
                  onClick={() => setShowProfModal(true)}
                  className="bg-[#FEFCBF] hover:bg-[#FAF089] active:translate-y-0.5 text-[#5A3825] font-bold text-sm px-3.5 py-2.5 rounded-2xl border-3 border-[#5A3825] kawaii-shadow-sm transition"
                  title="Professor Backdoor to Edit Diseases, Findings & Graphics"
                >
                  ⚙️ Professor Mode
                </button>
              </div>
            </div>

            {/* Short Instructions Banner */}
            <div className="mt-3 pt-3 border-t-2 border-dashed border-[#FAD2CC] flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 text-sm text-[#6B4433]">
              {gameMode === 'mode1' ? (
                <p>
                  <strong className="text-[#C85A5A]">Instructions (Mode 1):</strong> Click the <strong>Disease Deck</strong> on the left to draw a patient card. Then select all consistent <strong>Physical Exam Finding cards</strong> on the right (<span className="text-[#2F855A] font-bold">+1 Light Green</span> for correct, <span className="text-[#9B2C2C] font-bold">-1 Dark Red</span> for inconsistent).
                </p>
              ) : (
                <p>
                  <strong className="text-[#C85A5A]">Instructions (Mode 2):</strong> Examine the patient's <strong>Inspection, Palpation, Percussion, and Auscultation (IPPA)</strong> findings in the table below (remember: some findings in disease can still be <strong>normal</strong>!), then click the matching <strong>Mystery Disease Card</strong> to flip and reveal its pathology!
                </p>
              )}

              {/* Quick Classroom Case Selector */}
              <div className="flex items-center gap-2 shrink-0">
                <label className="text-xs font-bold text-[#8C584C]">Jump to Case:</label>
                <select
                  value={gameMode === 'mode1' ? (currentDiseaseIndex ?? '') : mode2CaseIndex}
                  onChange={(e) => {
                    const val = e.target.value;
                    if (val === '') return;
                    if (gameMode === 'mode1') {
                      handleDrawDiseaseCard(Number(val));
                    } else {
                      startMode2Case(Number(val));
                    }
                  }}
                  className="bg-[#FFF5F5] border-2 border-[#5A3825] rounded-xl px-2.5 py-1 text-xs font-bold text-[#5A3825]"
                >
                  {gameMode === 'mode1' && <option value="">-- Draw from Deck --</option>}
                  {diseases.map((d, idx) => (
                    <option key={d.id} value={idx}>
                      {gameMode === 'mode2' ? `Mystery Case #${idx + 1}` : `${idx + 1}. ${d.name}`}
                    </option>
                  ))}
                </select>
              </div>
            </div>
          </header>

          {/* ==========================================
              MODE 1: DISEASE DECK (LEFT) -> FINDINGS (RIGHT)
             ========================================== */}
          {gameMode === 'mode1' && (
            <main className="max-w-7xl w-full mx-auto flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              {/* LEFT SIDE: DISEASE CARD AREA (5 Columns on large screens) */}
              <section className="lg:col-span-5 flex flex-col gap-4">
                <div className="bg-[#FFFDF9] border-4 border-[#5A3825] rounded-3xl p-5 kawaii-shadow flex flex-col items-center justify-between min-h-[540px]">
                  <div className="w-full flex items-center justify-between border-b-2 border-[#FAD2CC] pb-2.5">
                    <span className="text-xs font-bold uppercase tracking-wider text-[#8C584C]">
                      Left Area • Disease Deck ({diseases.length} Cases)
                    </span>
                    {currentDisease && (
                      <button
                        onClick={() => handleDrawDiseaseCard()}
                        className="bg-[#C85A5A] hover:bg-[#B24949] text-white text-xs font-bold px-3 py-1.5 rounded-xl border-2 border-[#5A3825] transition"
                      >
                        🃏 Draw Next Disease Card ➔
                      </button>
                    )}
                  </div>

                  {/* If no card drawn yet: show clickable stacked deck graphic */}
                  {!currentDisease ? (
                    <div className="my-auto flex flex-col items-center text-center py-8">
                      <button
                        onClick={() => handleDrawDiseaseCard(0)}
                        className="group relative w-64 h-80 bg-[#FAD2CC] hover:bg-[#F8C2BA] border-4 border-[#5A3825] rounded-3xl kawaii-shadow flex flex-col items-center justify-center p-6 transition transform hover:-translate-y-1 cursor-pointer"
                      >

                                  handleUpdateDiseaseField(editingDisease.id, 'graphicType', e.target.value)
                                }
                                className="w-full border-2 border-[#5A3825] rounded-xl px-3 py-1.5 text-xs bg-white"
                              >
                                <option value="consolidation_left">Left Lower Lung Consolidation</option>
                                <option value="pneumothorax_right">Right Tension Pneumothorax</option>
                                <option value="effusion_left">Massive Left Pleural Effusion</option>
                                <option value="edema_bilat">Bilateral Pulmonary Edema</option>
                                <option value="asthma_severe">Severe Asthmatic Attack</option>
                              </select>
                            </div>
                            <div>
                              <label className="block text-xs font-bold">
                                Custom Image URL or Upload PNG/JPG (Overrides Preset):
                              </label>
                              <input
                                type="text"
                                value={editingDisease.customImageUrl || ''}
                                onChange={(e) =>
                                  handleUpdateDiseaseField(editingDisease.id, 'customImageUrl', e.target.value)
                                }
                                placeholder="Paste image URL or upload file below..."
                                className="w-full border-2 border-[#5A3825] rounded-xl px-3 py-1 text-xs mb-1"
                              />
                              <input
                                type="file"
                                accept="image/*"
                                onChange={(e) => handleImageFileUpload(editingDisease.id, e)}
                                className="text-xs"
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-bold">Pathophysiology Explanation:</label>
                              <textarea
                                rows={3}
                                value={editingDisease.pathophysiology}
                                onChange={(e) =>
                                  handleUpdateDiseaseField(editingDisease.id, 'pathophysiology', e.target.value)
                                }
                                className="w-full border-2 border-[#5A3825] rounded-xl p-2 text-xs"
                              />
                            </div>
                          </div>

                          {/* Mode 2 IPPA Table Text Editor */}
                          <div className="space-y-2">
                            <h4 className="text-xs font-bold text-[#C85A5A] uppercase">
                              Mode 2 IPPA Table Text for {editingDisease.name}:
                            </h4>
                            {['inspection', 'palpation', 'percussion', 'auscultation'].map((step) => (
                              <div key={step}>
                                <label className="block text-[11px] font-bold capitalize">{step}:</label>
                                <input
                                  type="text"
                                  value={editingDisease.ippaTable?.[step] || ''}
                                  onChange={(e) =>
                                    handleUpdateIppaField(editingDisease.id, step, e.target.value)
                                  }
                                  className="w-full border-2 border-[#5A3825] rounded-xl px-2.5 py-1 text-xs"
                                />
                              </div>
                            ))}
                          </div>
                        </div>

                        {/* Checkboxes to link Mode 1 Finding Cards to this Disease */}
                        <div className="bg-[#FFFDF9] border-2 border-[#5A3825] rounded-2xl p-4">
                          <h4 className="text-xs font-bold text-[#C85A5A] uppercase mb-2">
                            Mode 1 Answer Key — Check All Correct Finding Cards for {editingDisease.name}:
                          </h4>
                          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 max-h-60 overflow-y-auto p-1">
                            {findings.map((f) => {
                              const checked = editingDisease.findingIds.includes(f.id);
                              return (
                                <label
                                  key={f.id}
                                  className={`flex items-start gap-2 p-2 rounded-xl border text-xs cursor-pointer ${
                                    checked
                                      ? 'bg-[#F0FFF4] border-[#38A169] font-bold'
                                      : 'bg-white border-gray-300'
                                  }`}
                                >
                                  <input
                                    type="checkbox"
                                    checked={checked}
                                    onChange={() => handleToggleFindingForDisease(editingDisease.id, f.id)}
                                    className="mt-0.5"
                                  />
                                  <span>
                                    <strong className="text-[#C85A5A]">[{f.category}]</strong> {f.title}
                                  </span>
                                </label>
                              );
                            })}
                          </div>
                        </div>
                      </div>
                    )}

                    {/* TAB 2: ADD / EDIT FINDINGS POOL */}
                    {profTab === 'findings' && (
                      <div className="space-y-4">
                        <form
                          onSubmit={handleAddFinding}
                          className="bg-[#FFF5F5] border-2 border-[#5A3825] rounded-2xl p-4 grid grid-cols-1 md:grid-cols-4 gap-3"
                        >
                          <div>
                            <label className="block text-xs font-bold">Category (Icon):</label>
                            <select
                              value={newFinding.category}
                              onChange={(e) =>
                                setNewFinding((prev) => ({ ...prev, category: e.target.value }))
                              }
                              className="w-full border-2 border-[#5A3825] rounded-xl px-2.5 py-1.5 text-xs bg-white"
                            >
                              <option value="Inspection">👁️ Inspection</option>
                              <option value="Palpation">✋ Palpation</option>
                              <option value="Percussion">👆 Percussion</option>
                              <option value="Auscultation">🩺 Auscultation</option>
                            </select>
                          </div>
                          <div>
                            <label className="block text-xs font-bold">Card Title:</label>
                            <input
                              type="text"
                              value={newFinding.title}
                              onChange={(e) =>
                                setNewFinding((prev) => ({ ...prev, title: e.target.value }))
                              }
                              placeholder="e.g. Egophony (E-to-A)"
                              className="w-full border-2 border-[#5A3825] rounded-xl px-2.5 py-1.5 text-xs"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-bold">Short Subtitle:</label>
                            <input
                              type="text"
                              value={newFinding.subtitle}
                              onChange={(e) =>
                                setNewFinding((prev) => ({ ...prev, subtitle: e.target.value }))
                              }
                              placeholder="Heard over consolidated lung"
                              className="w-full border-2 border-[#5A3825] rounded-xl px-2.5 py-1.5 text-xs"
                            />
                          </div>
                          <div className="flex items-end">
                            <button
                              type="submit"
                              className="w-full bg-[#38A169] text-white font-bold text-xs py-2 rounded-xl border-2 border-[#5A3825]"
                            >
                              + Add New Finding Card
                            </button>
                          </div>
                        </form>

                        <div className="max-h-64 overflow-y-auto space-y-2 pr-1">
                          {findings.map((f) => (
                            <div
                              key={f.id}
                              className="flex items-center justify-between bg-white border-2 border-[#5A3825] rounded-xl px-3 py-2 text-xs"
                            >
                              <div>
                                <span className="font-bold text-[#C85A5A]">[{f.category}]</span>{' '}
                                <strong>{f.title}</strong> — <span className="text-[#8C584C]">{f.subtitle}</span>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="max-w-7xl w-full mx-auto mt-6 text-center text-xs text-[#8C584C]">
            Respiratory System I • Preclinical Physical Examination Interactive Teaching Module
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
