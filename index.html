            <path d="M29 44C30 45 31 45 32 44" stroke="#5A3825" strokeWidth="2" strokeLinecap="round" />
          </svg>
        );
      }
      // Inspection
      return (
        <svg width={size} height={size} viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="28" fill="#E9D8FD" stroke="#5A3825" strokeWidth="3" />

          <circle cx="34" cy="29" r="2.5" fill="#FFFDF9" />

    function LungPathologyGraphic({ type, customImageUrl, mystery = false, size = 'large' }) {
      if (!mystery && customImageUrl && customImageUrl.trim() !== '') {
        return (
          <div className="w-full h-full flex items-center justify-center p-2">
            <img src={customImageUrl} alt="Disease diagram" className="max-h-56 object-contain rounded-2xl border-2 border-[#5A3825]" />
          </div>
        );
      }

      // Trachea shift (Patient Right = Viewer Left, Patient Left = Viewer Right)
      // pneumothorax_right pushes Left (viewer Right: +12)
      // effusion_left pushes Right (viewer Left: -12)
      // atelectasis_lul pulls Left (viewer Right: +12)
      // atelectasis_rll pulls Right (viewer Left: -12)
      const tracheaShift = mystery ? 0 : 
        (type === 'pneumothorax_right' || type === 'atelectasis_lul') ? 12 : 
        (type === 'effusion_left' || type === 'pneumothorax_left' || type === 'atelectasis_rll') ? -12 :

      const svgHeight = size === 'small' ? 150 : 240;

      return (
        <div className="relative flex flex-col items-center justify-center w-full">

            <path d="M115 58 C82 55, 42 80, 38 140 C36 172, 60 185, 112 175 C118 173, 120 155, 118 115 Z" fill={!mystery && type === 'pneumothorax_right' ? '#E2F1FF' : '#FFF5F5'} stroke="#5A3825" strokeWidth="3.5" strokeDasharray={!mystery && type === 'pneumothorax_right' ? '5 3' : 'none'} />

            {/* Trachea & Cartilage Rings */}
            <g transform={`translate(${tracheaShift}, 0)`}>
              <rect x="120" y="12" width="20" height="54" rx="6" fill="#F6C29F" stroke="#5A3825" strokeWidth="3.5" />

              <line x1="122" y1="52" x2="138" y2="52" stroke="#D68C65" strokeWidth="3" />
              
              {/* Bronchi - show obstruction block if atelectasis */}
              <path d="M125 63 L100 84" stroke="#5A3825" strokeWidth="8" strokeLinecap="round" />
              <path d="M135 63 L160 84" stroke="#5A3825" strokeWidth="8" strokeLinecap="round" />
              <path d="M125 63 L100 84" stroke="#F6C29F" strokeWidth="4" strokeLinecap="round" />
              <path d="M135 63 L160 84" stroke="#F6C29F" strokeWidth="4" strokeLinecap="round" />
              
              {!mystery && type === 'atelectasis_rll' && <circle cx="108" cy="77" r="5" fill="#E53E3E" />}
              {!mystery && type === 'atelectasis_lul' && <circle cx="152" cy="77" r="5" fill="#E53E3E" />}
            </g>

            {/* Trachea Shift Arrow Indicator */}
            {!mystery && tracheaShift !== 0 && (
              <g>
                <path d={tracheaShift > 0 ? "M95 28 L118 28" : "M165 28 L142 28"} stroke="#E53E3E" strokeWidth="3.5" strokeLinecap="round" />
                <polygon points={tracheaShift > 0 ? "118,23 126,28 118,33" : "142,23 134,28 142,33"} fill="#E53E3E" />
              </g>
            )}

            {/* PATIENT'S RIGHT LUNG (Viewer Left) */}
            {!mystery && type === 'pneumothorax_right' ? (
              <g>
                <path d="M114 82 C96 82, 82 98, 80 128 C79 145, 92 152, 112 146 Z" fill="#E5989B" stroke="#5A3825" strokeWidth="3.5" />
                <text x="48" y="105" fill="#2B6CB0" fontSize="11" fontWeight="bold">AIR ++</text>
                <path d="M58 115 L75 118" stroke="#2B6CB0" strokeWidth="2.5" strokeLinecap="round" />
                <path d="M55 140 L75 135" stroke="#2B6CB0" strokeWidth="2.5" strokeLinecap="round" />
                <text x="90" y="122" fill="#5A3825" fontSize="11" fontWeight="bold">x_x</text>
              </g>
            ) : !mystery && type === 'atelectasis_rll' ? (
              <g>
                {/* Collapsed right lower lobe */}
                <path d="M115 62 C85 60, 60 75, 55 100 C75 105, 100 110, 113 115 Z" fill="#F4A29E" stroke="#5A3825" strokeWidth="3.5" />
                <path d="M55 100 C50 115, 60 145, 111 160 Z" fill="#E5989B" stroke="#5A3825" strokeWidth="3.5" />
                <text x="65" y="145" fill="#5A3825" fontSize="10" fontWeight="bold">COLLAPSE</text>
              </g>
            ) : !mystery && type === 'effusion_right_mod' ? (
              <g>
                {/* Moderate effusion right */}
                <path d="M115 62 C85 60, 46 84, 43 138 C41 150, 45 155, 60 155 C80 155, 100 160, 111 170 Z" fill="#F4A29E" stroke="#5A3825" strokeWidth="3.5" />
                <path d="M43 138 C41 168, 63 180, 111 170 C100 160, 80 155, 60 155 C45 155, 41 150, 43 138 Z" fill="#63B3ED" stroke="#5A3825" strokeWidth="3" />
                <text x="60" y="165" fill="#FFFDF9" fontSize="10" fontWeight="bold">FLUID</text>
              </g>
            ) : (
              <g>
                <path d={!mystery && type === 'asthma_severe' ? "M116 55 C80 50, 35 78, 33 144 C31 178, 58 190, 114 178 Z" : "M115 62 C85 60, 46 84, 43 138 C41 168, 63 180, 111 170 Z"} fill="#F4A29E" stroke="#5A3825" strokeWidth="3.5" />
                {!mystery && type === 'consolidation_right_upper' && (
                  <g>
                    <path d="M115 62 C85 60, 50 75, 48 95 C75 105, 100 100, 113 115 Z" fill="#D69E2E" opacity="0.85" stroke="#5A3825" strokeWidth="3" />
                    <text x="65" y="85" fill="#5A3825" fontSize="9" fontWeight="bold">EXUDATE</text>
                  </g>
                )}
                {/* Face */}
                <circle cx="72" cy="118" r="3.5" fill="#5A3825" />
                <circle cx="94" cy="118" r="3.5" fill="#5A3825" />
                <path d={!mystery && (type === 'edema_bilat' || type === 'asthma_severe') ? "M79 128 Q83 122 87 128" : "M78 124 Q83 130 88 124"} stroke="#5A3825" strokeWidth="2.8" strokeLinecap="round" />
              </g>
            )}

            {/* PATIENT'S LEFT LUNG (Viewer Right) */}
            {!mystery && type === 'effusion_left' ? (
              <g>
                <path d="M145 66 C168 65, 192 82, 194 115 C180 125, 160 126, 145 120 Z" fill="#F4A29E" stroke="#5A3825" strokeWidth="3.5" />
                <path d="M142 122 C165 132, 195 125, 218 110 C222 138, 218 175, 148 174 C142 172, 141 150, 142 122 Z" fill="#63B3ED" stroke="#5A3825" strokeWidth="3" />
                <text x="156" y="156" fill="#FFFDF9" fontSize="11" fontWeight="bold">FLUID</text>
                <text x="162" y="100" fill="#5A3825" fontSize="11" fontWeight="bold">x_x</text>
              </g>
            ) : !mystery && type === 'pneumothorax_left' ? (
              <g>
                <path d="M146 82 C164 82, 178 98, 180 128 C181 145, 168 152, 148 146 Z" fill="#E5989B" stroke="#5A3825" strokeWidth="3.5" />
                <text x="180" y="105" fill="#2B6CB0" fontSize="11" fontWeight="bold">AIR ++</text>
                <path d="M202 115 L185 118" stroke="#2B6CB0" strokeWidth="2.5" strokeLinecap="round" />
                <path d="M205 140 L185 135" stroke="#2B6CB0" strokeWidth="2.5" strokeLinecap="round" />
                <text x="155" y="122" fill="#5A3825" fontSize="11" fontWeight="bold">x_x</text>
              </g>
            ) : !mystery && type === 'atelectasis_lul' ? (
              <g>
                {/* Collapsed left upper lobe */}
                <path d="M145 75 C160 100, 185 115, 215 110 C219 140, 197 180, 149 170 Z" fill="#F4A29E" stroke="#5A3825" strokeWidth="3.5" />
                <path d="M145 62 C175 60, 200 75, 215 110 C185 115, 160 100, 145 75 Z" fill="#E5989B" stroke="#5A3825" strokeWidth="3.5" />
                <text x="155" y="90" fill="#5A3825" fontSize="10" fontWeight="bold">COLLAPSE</text>
              </g>
            ) : (
              <g>
                <path d={!mystery && type === 'asthma_severe' ? "M144 55 C180 50, 225 78, 227 144 C229 178, 202 190, 146 178 Z" : "M145 62 C175 60, 214 84, 217 138 C219 168, 197 180, 149 170 Z"} fill="#F4A29E" stroke="#5A3825" strokeWidth="3.5" />
                {!mystery && type === 'consolidation_left' && (
                  <g>
                    <path d="M148 122 C172 115, 202 120, 215 136 C217 166, 195 178, 149 169 Z" fill="#D69E2E" opacity="0.85" stroke="#5A3825" strokeWidth="3" />
                    <text x="155" y="155" fill="#5A3825" fontSize="9.5" fontWeight="bold">EXUDATE</text>
                  </g>
                )}
                {/* Face */}
                <circle cx="166" cy="112" r="3.5" fill="#5A3825" />
                <circle cx="188" cy="112" r="3.5" fill="#5A3825" />
                <path d={!mystery ? "M173 122 Q177 116 181 122" : "M172 118 Q177 124 182 118"} stroke="#5A3825" strokeWidth="2.8" strokeLinecap="round" />
              </g>
            )}

            {/* Bilateral Pulmonary Edema */}
            {!mystery && type === 'edema_bilat' && (
              <g>
                <path d="M44 138 C65 132, 95 135, 111 142 C111 168, 63 178, 44 138 Z" fill="#90CDF4" opacity="0.75" />
                <path d="M149 142 C165 135, 195 132, 216 138 C197 178, 149 168, 149 142 Z" fill="#90CDF4" opacity="0.75" />
                <circle cx="68" cy="152" r="4" fill="#FFFDF9" stroke="#2B6CB0" />
                <circle cx="84" cy="158" r="3" fill="#FFFDF9" stroke="#2B6CB0" />
                <circle cx="166" cy="150" r="3.5" fill="#FFFDF9" stroke="#2B6CB0" />
                <circle cx="182" cy="158" r="4" fill="#FFFDF9" stroke="#2B6CB0" />
              </g>
            )}

            {/* Asthma Wheeze */}
            {!mystery && type === 'asthma_severe' && (
              <g>
                <path d="M58 92 Q78 82 95 96" stroke="#DD6B20" strokeWidth="3" strokeLinecap="round" strokeDasharray="3 3" />
                <path d="M162 96 Q180 82 200 92" stroke="#DD6B20" strokeWidth="3" strokeLinecap="round" strokeDasharray="3 3" />
                <text x="58" y="156" fill="#C05621" fontSize="10" fontWeight="bold">WHEEZE ~</text>
                <text x="156" y="156" fill="#C05621" fontSize="10" fontWeight="bold">~ WHEEZE</text>
              </g>
            )}

            {/* Mystery Overlay */}
            {mystery && (
              <g>
                <circle cx="130" cy="122" r="24" fill="#FFFDF9" stroke="#5A3825" strokeWidth="3.5" />
                <text x="121" y="133" fill="#C85A5A" fontSize="28" fontWeight="bold">?</text>
              </g>
            )}
          </svg>
        </div>
      );
    }

    // ==========================================
    // MAIN APP
    // ==========================================
    function App() {
      const [diseases, setDiseases] = useState(() => {
        try { const saved = localStorage.getItem('resp_pe_diseases_v3'); return saved ? JSON.parse(saved) : DEFAULT_DISEASES; } catch (e) { return DEFAULT_DISEASES; }
      });
      const [findings, setFindings] = useState(() => {
        try { const saved = localStorage.getItem('resp_pe_findings_v3'); return saved ? JSON.parse(saved) : DEFAULT_FINDINGS; } catch (e) { return DEFAULT_FINDINGS; }
      });

      useEffect(() => {
        try {
          localStorage.setItem('resp_pe_diseases_v3', JSON.stringify(diseases));
          localStorage.setItem('resp_pe_findings_v3', JSON.stringify(findings));
        } catch (e) {}
      }, [diseases, findings]);

      const [gameMode, setGameMode] = useState('mode1');
      const [score, setScore] = useState(0);

      // Mode 1 States
      const [currentDiseaseIndex, setCurrentDiseaseIndex] = useState(null);
      const [presentedFindings, setPresentedFindings] = useState([]);
      const [selectedFindingIds, setSelectedFindingIds] = useState([]);
      const [activeFeedback, setActiveFeedback] = useState(null);

      // Mode 2 States
      const [mode2CaseIndex, setMode2CaseIndex] = useState(0);
      const [stepByStepIppa, setStepByStepIppa] = useState(true);
      const [revealedSteps, setRevealedSteps] = useState({
        inspection: true, palpation_trachea: false, palpation_expansion: false, palpation_fremitus: false,
        percussion: false, auscultation_breath: false, auscultation_vocal: false
      });
      const [guessedDiseaseIds, setGuessedDiseaseIds] = useState([]);
      const [mode2Feedback, setMode2Feedback] = useState(null);

      // Editor States
      const [showProfModal, setShowProfModal] = useState(false);
      const [profUnlocked, setProfUnlocked] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [profTab, setProfTab] = useState('diseases');
      const [editingDiseaseId, setEditingDiseaseId] = useState(diseases[0]?.id || '');

      const shuffleArray = (arr) => {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      };

      const setupMode1Cards = (diseaseObj) => {
        if (!diseaseObj) return;
        const correctCards = findings.filter((f) => diseaseObj.findingIds.includes(f.id));
        const distractorPool = findings.filter((f) => !diseaseObj.findingIds.includes(f.id));
        const targetCount = Math.max(9, correctCards.length + 3);
        const neededDistractors = Math.max(0, targetCount - correctCards.length);
        const chosenDistractors = shuffleArray(distractorPool).slice(0, neededDistractors);
        setPresentedFindings(shuffleArray([...correctCards, ...chosenDistractors]));
        setSelectedFindingIds([]);
        setActiveFeedback(null);
      };

      const handleDrawDiseaseCard = (forcedIndex = null) => {
        if (diseases.length === 0) return;
        const nextIdx = forcedIndex !== null ? forcedIndex : (currentDiseaseIndex === null ? 0 : (currentDiseaseIndex + 1) % diseases.length);
        setCurrentDiseaseIndex(nextIdx);
        setupMode1Cards(diseases[nextIdx]);
      };

      const handleSelectFinding = (finding) => {
        if (currentDiseaseIndex === null) return;
        const currentDisease = diseases[currentDiseaseIndex];
        const isCorrect = currentDisease.findingIds.includes(finding.id);
        
        if (!selectedFindingIds.includes(finding.id)) {
          setSelectedFindingIds((prev) => [...prev, finding.id]);
          setScore((prev) => (isCorrect ? prev + 1 : prev - 1));
        }
        setActiveFeedback({ finding, isCorrect });
      };

      const currentDisease = currentDiseaseIndex !== null ? diseases[currentDiseaseIndex] : null;
      const correctSelectedCount = useMemo(() => {
        if (!currentDisease) return 0;
        return selectedFindingIds.filter((id) => currentDisease.findingIds.includes(id)).length;
      }, [currentDisease, selectedFindingIds]);

      const totalCorrectForCurrent = currentDisease ? currentDisease.findingIds.length : 0;
      const isMode1RoundComplete = currentDisease && totalCorrectForCurrent > 0 && correctSelectedCount === totalCorrectForCurrent;

      const currentMode2Case = diseases[mode2CaseIndex] || diseases[0];

      const startMode2Case = (idx) => {
        const nextIdx = typeof idx === 'number' ? idx : (mode2CaseIndex + 1) % diseases.length;
        setMode2CaseIndex(nextIdx);
        setGuessedDiseaseIds([]);
        setMode2Feedback(null);
        setRevealedSteps(stepByStepIppa 
          ? { inspection: true, palpation_trachea: false, palpation_expansion: false, palpation_fremitus: false, percussion: false, auscultation_breath: false, auscultation_vocal: false }
          : { inspection: true, palpation_trachea: true, palpation_expansion: true, palpation_fremitus: true, percussion: true, auscultation_breath: true, auscultation_vocal: true }
        );
      };

      const toggleStepByStepMode = (useSteps) => {
        setStepByStepIppa(useSteps);
        setRevealedSteps(useSteps
          ? { inspection: true, palpation_trachea: false, palpation_expansion: false, palpation_fremitus: false, percussion: false, auscultation_breath: false, auscultation_vocal: false }
          : { inspection: true, palpation_trachea: true, palpation_expansion: true, palpation_fremitus: true, percussion: true, auscultation_breath: true, auscultation_vocal: true }
        );
      };

      const handleGuessDiseaseMode2 = (disease) => {
        if (guessedDiseaseIds.includes(disease.id)) {
          setMode2Feedback({ disease, isCorrect: disease.id === currentMode2Case.id });
          return;
        }
        const isCorrect = disease.id === currentMode2Case.id;
        setGuessedDiseaseIds((prev) => [...prev, disease.id]);
        setScore((prev) => (isCorrect ? prev + 1 : prev - 1));
        setMode2Feedback({ disease, isCorrect });
        if (isCorrect) {
          setRevealedSteps({ inspection: true, palpation_trachea: true, palpation_expansion: true, palpation_fremitus: true, percussion: true, auscultation_breath: true, auscultation_vocal: true });
        }
      };

      const handleResetGame = () => {
        setScore(0);
        setSelectedFindingIds([]);
        setActiveFeedback(null);
        if (currentDiseaseIndex !== null) setupMode1Cards(diseases[currentDiseaseIndex]);
        setGuessedDiseaseIds([]);
        setMode2Feedback(null);
        setRevealedSteps(stepByStepIppa 
          ? { inspection: true, palpation_trachea: false, palpation_expansion: false, palpation_fremitus: false, percussion: false, auscultation_breath: false, auscultation_vocal: false }
          : { inspection: true, palpation_trachea: true, palpation_expansion: true, palpation_fremitus: true, percussion: true, auscultation_breath: true, auscultation_vocal: true }
        );
      };

      return (
        <div className="min-h-screen flex flex-col justify-between p-3 md:p-6 select-none">
          <header className="max-w-7xl w-full mx-auto bg-[#FFFDF9] border-4 border-[#5A3825] rounded-3xl p-4 md:p-5 kawaii-shadow mb-5">
            <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
              <div className="flex items-center gap-3.5">
                <div className="w-14 h-14 rounded-2xl bg-[#FAD2CC] border-3 border-[#5A3825] flex items-center justify-center text-3xl shrink-0 kawaii-shadow-sm">🫁</div>
                <div>
                  <span className="text-xs font-bold uppercase bg-[#FFE4E6] text-[#C85A5A] px-2.5 py-0.5 rounded-full border border-[#5A3825]">Year 1 Medical Physiology</span>
                  <h1 className="text-2xl md:text-3xl font-bold text-[#C85A5A] tracking-tight mt-0.5">Respiratory System Physical Examination</h1>
                </div>
              </div>

              <div className="flex bg-[#FDF0F0] p-1.5 rounded-2xl border-2 border-[#5A3825]">
                <button onClick={() => setGameMode('mode1')} className={`px-3.5 py-2 rounded-xl text-sm font-bold transition-all ${gameMode === 'mode1' ? 'bg-[#C85A5A] text-white shadow-sm' : 'text-[#5A3825] hover:bg-[#FAD2CC]/50'}`}>🃏 Mode 1: Match Findings</button>
                <button onClick={() => setGameMode('mode2')} className={`px-3.5 py-2 rounded-xl text-sm font-bold transition-all ${gameMode === 'mode2' ? 'bg-[#C85A5A] text-white shadow-sm' : 'text-[#5A3825] hover:bg-[#FAD2CC]/50'}`}>🩺 Mode 2: Diagnose Patient</button>
              </div>

              <div className="flex items-center gap-2.5">
                <div className="bg-[#FFE4E6] border-3 border-[#5A3825] rounded-2xl px-4 py-1.5 flex items-center gap-2 kawaii-shadow-sm">
                  <span className="text-xs font-bold uppercase text-[#8C584C]">Score</span>
                  <span className={`text-2xl font-bold font-display ${score >= 0 ? 'text-[#2F855A]' : 'text-[#9B2C2C]'}`}>{score > 0 ? `+${score}` : score}</span>
                </div>
                <button onClick={handleResetGame} className="bg-[#FFF5F5] hover:bg-[#FED7D7] text-[#5A3825] font-bold text-sm px-3.5 py-2.5 rounded-2xl border-3 border-[#5A3825] kawaii-shadow-sm transition">🔄 Reset</button>
                <button onClick={() => setShowProfModal(true)} className="bg-[#FEFCBF] hover:bg-[#FAF089] text-[#5A3825] font-bold text-sm px-3.5 py-2.5 rounded-2xl border-3 border-[#5A3825] kawaii-shadow-sm transition">⚙️ Prof Mode</button>
              </div>
            </div>

            <div className="mt-3 pt-3 border-t-2 border-dashed border-[#FAD2CC] flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 text-sm text-[#6B4433]">
              {gameMode === 'mode1' ? 
                <p><strong className="text-[#C85A5A]">Mode 1:</strong> Draw a Disease Card, then click all matching physical exam findings.</p> : 
                <p><strong className="text-[#C85A5A]">Mode 2:</strong> Examine the IPPA findings, then click the correct Mystery Lung to diagnose.</p>}
              
              <div className="flex items-center gap-2">
                <label className="text-xs font-bold text-[#8C584C]">Jump to Case:</label>
                <select value={gameMode === 'mode1' ? (currentDiseaseIndex ?? '') : mode2CaseIndex} onChange={(e) => { const v = e.target.value; if(v==='') return; gameMode === 'mode1' ? handleDrawDiseaseCard(Number(v)) : startMode2Case(Number(v)); }} className="bg-[#FFF5F5] border-2 border-[#5A3825] rounded-xl px-2.5 py-1 text-xs font-bold text-[#5A3825]">
                  {gameMode === 'mode1' && <option value="">-- Draw from Deck --</option>}
                  {diseases.map((d, idx) => <option key={d.id} value={idx}>{gameMode === 'mode2' ? `Mystery Case #${idx + 1}` : `${idx + 1}. ${d.name}`}</option>)}
                </select>
              </div>
            </div>
          </header>

          {/* ======================= MODE 1 ======================= */}
          {gameMode === 'mode1' && (
            <main className="max-w-7xl w-full mx-auto flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              <section className="lg:col-span-5 bg-[#FFFDF9] border-4 border-[#5A3825] rounded-3xl p-5 kawaii-shadow flex flex-col justify-between min-h-[540px]">
                <div className="w-full flex items-center justify-between border-b-2 border-[#FAD2CC] pb-2.5">
                  <span className="text-xs font-bold uppercase text-[#8C584C]">Disease Deck ({diseases.length} Cases)</span>
                  {currentDisease && <button onClick={() => handleDrawDiseaseCard()} className="bg-[#C85A5A] text-white text-xs font-bold px-3 py-1.5 rounded-xl border-2 border-[#5A3825]">🃏 Next Card ➔</button>}
                </div>
                {!currentDisease ? (
                  <div className="my-auto flex flex-col items-center py-8">
                    <button onClick={() => handleDrawDiseaseCard(0)} className="group relative w-64 h-80 bg-[#FAD2CC] hover:bg-[#F8C2BA] border-4 border-[#5A3825] rounded-3xl kawaii-shadow flex flex-col items-center justify-center p-6 cursor-pointer">
                      <div className="absolute -right-2.5 -bottom-2.5 w-full h-full rounded-3xl border-4 border-[#5A3825] bg-[#FFE4E6] -z-10"></div>
                      <div className="text-5xl mb-4 animate-float">🫁</div>
                      <span className="font-display text-2xl font-bold text-[#C85A5A]">DISEASE DECK</span>
                      <span className="text-xs font-bold text-[#5A3825] mt-2 bg-[#FFFDF9] px-3 py-1 rounded-full border-2 border-[#5A3825]">👆 Click to Draw!</span>
                    </button>
                  </div>
                ) : (
                  <div className="flex-1 flex flex-col justify-between mt-3">
                    <div className="bg-[#FFF5F5] border-3 border-[#5A3825] rounded-2xl p-4 text-center">
                      <span className="inline-block text-xs font-bold bg-[#FAD2CC] text-[#5A3825] px-3 py-0.5 rounded-full border border-[#5A3825] mb-1">Case {currentDiseaseIndex + 1} of {diseases.length} • {currentDisease.shortTag}</span>
                      <h2 className="text-2xl font-bold text-[#C85A5A] font-display leading-tight">{currentDisease.name}</h2>
                    </div>
                    <div className="my-3 bg-[#FFFDF9] border-2 border-dashed border-[#FAD2CC] rounded-2xl p-3 flex flex-col items-center">
                      <LungPathologyGraphic type={currentDisease.graphicType} customImageUrl={currentDisease.customImageUrl} mystery={false} />
                    </div>
                    <div className="space-y-2.5">
                      <div className="flex items-center justify-between bg-[#FFE4E6] border-2 border-[#5A3825] rounded-xl px-3.5 py-2">
                        <span className="text-xs font-bold text-[#5A3825]">Matched Findings:</span>
                        <span className="text-sm font-bold text-[#C85A5A]">{correctSelectedCount} / {totalCorrectForCurrent} Found</span>
                      </div>
                      {isMode1RoundComplete ? (
                        <div className="bg-[#FEFCBF] border-2 border-[#5A3825] rounded-xl p-3 text-xs text-[#5A3825]">
                          <strong className="block text-[#975A16] mb-0.5">💡 Pathophysiology (Unlocked!):</strong>
                          {currentDisease.pathophysiology}
                        </div>
                      ) : (
                        <div className="bg-[#FFF5F5] border-2 border-dashed border-[#FAD2CC] rounded-xl p-3 text-xs text-[#8C584C] text-center">
                          🔒 <strong>Hidden</strong> — Find all {totalCorrectForCurrent} correct physical signs on the right to unlock mechanism.
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </section>

              <section className="lg:col-span-7 bg-[#FFFDF9] border-4 border-[#5A3825] rounded-3xl p-5 kawaii-shadow min-h-[540px] flex flex-col justify-between">
                <div className="flex flex-wrap items-center justify-between border-b-2 border-[#FAD2CC] pb-2.5 mb-3">
                  <span className="text-xs font-bold uppercase text-[#8C584C]">Shuffled Findings Pool</span>
                </div>
                {!currentDisease ? (
                  <div className="my-auto text-center py-16 px-4">
                    <div className="text-5xl mb-3">👈</div>
                    <h3 className="text-xl font-bold text-[#C85A5A] font-display">Draw a Disease Card First!</h3>
                  </div>
                ) : (
                  <>
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3.5 my-auto">
                      {presentedFindings.map((finding) => {
                        const isSelected = selectedFindingIds.includes(finding.id);
                        const isRightAnswer = currentDisease.findingIds.includes(finding.id);
                        let stateStyle = 'bg-[#FFFDF9] border-[#5A3825] hover:-translate-y-0.5 kawaii-shadow-sm';
                        if (isSelected && isRightAnswer) stateStyle = 'kawaii-card-correct';
                        else if (isSelected && !isRightAnswer) stateStyle = 'kawaii-card-wrong';

                        return (
                          <button key={finding.id} onClick={() => handleSelectFinding(finding)} className={`text-left border-4 rounded-2xl p-3.5 flex flex-col items-center text-center justify-between transition-all cursor-pointer ${stateStyle}`}>
                            <div className="w-full flex items-center justify-between mb-1">
                              <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-[#FDF0F0] border border-[#5A3825] text-[#5A3825]">{finding.category}</span>
                              {isSelected && <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${isRightAnswer ? 'bg-[#68D391] text-[#22543D]' : 'bg-[#9B2C2C] text-white'}`}>{isRightAnswer ? '✓ +1' : '✗ -1'}</span>}
                            </div>
                            <div className="my-2"><CategoryIcon category={finding.category} size={46} /></div>
                            <div>
                              <h4 className="font-display font-bold text-sm text-[#5A3825]">{finding.title}</h4>
                            </div>
                          </button>
                        );
                      })}
                    </div>
                    <div className="mt-4 pt-3 border-t-2 border-[#FAD2CC]">
                      {isMode1RoundComplete && (
                        <div className="mb-3 bg-[#F0FFF4] border-3 border-[#38A169] rounded-2xl p-3.5 flex items-center justify-between">
                          <span className="text-sm font-bold text-[#22543D]">🎉 Case Mastered!</span>
                          <button onClick={() => handleDrawDiseaseCard()} className="bg-[#38A169] text-white text-xs font-bold px-4 py-2 rounded-xl border-2 border-[#22543D]">Next Disease ➔</button>
                        </div>
                      )}
                      {activeFeedback ? (
                        <div className={`rounded-2xl p-3.5 border-3 ${activeFeedback.isCorrect ? 'bg-[#F0FFF4] border-[#68D391] text-[#22543D]' : 'bg-[#FFF5F5] border-[#9B2C2C] text-[#742A2A]'}`}>
                          <div className="flex justify-between font-bold text-xs uppercase">
                            <span>{activeFeedback.isCorrect ? '✅ Correct (+1)' : '❌ Incorrect (-1)'}</span>
                            <span>{activeFeedback.finding.category}</span>
                          </div>
                          <p className="text-xs mt-1"><strong>{activeFeedback.finding.title}:</strong> {activeFeedback.finding.rationale}</p>
                        </div>
                      ) : (
                        <div className="text-xs text-center text-[#8C584C] py-2">👆 Click any finding card above to test if it matches the disease.</div>
                      )}
                    </div>
                  </>
                )}
              </section>
            </main>
          )}

          {/* ======================= MODE 2 ======================= */}
          {gameMode === 'mode2' && (
            <main className="max-w-7xl w-full mx-auto flex-1 flex flex-col gap-6">
              <section className="bg-[#FFFDF9] border-4 border-[#5A3825] rounded-3xl p-5 kawaii-shadow">
                <div className="flex flex-col md:flex-row md:items-center justify-between border-b-2 border-[#FAD2CC] pb-3 mb-4">
                  <div>
                    <span className="text-xs font-bold bg-[#FFE4E6] text-[#C85A5A] px-3 py-0.5 rounded-full border border-[#5A3825]">Mystery Patient #{mode2CaseIndex + 1}</span>
                    <h2 className="text-xl font-bold text-[#5A3825] font-display mt-1">IPPA Chart — What is your diagnosis?</h2>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => toggleStepByStepMode(!stepByStepIppa)} className="bg-[#FEFCBF] text-[#5A3825] text-xs font-bold px-3 py-2 rounded-xl border-2 border-[#5A3825]">{stepByStepIppa ? '🔓 Reveal All' : '👣 Step-by-Step'}</button>
                    <button onClick={() => startMode2Case()} className="bg-[#C85A5A] text-white text-xs font-bold px-4 py-2 rounded-xl border-2 border-[#5A3825]">🎲 Next Patient ➔</button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  {/* Inspection */}
                  <div className="bg-[#FFF5F5] border-3 border-[#5A3825] rounded-2xl p-3 flex flex-col">
                    <div className="flex items-center gap-2 border-b-2 border-[#FAD2CC] pb-2 mb-2"><CategoryIcon category="Inspection" size={32} /> <h3 className="font-bold text-[#C85A5A]">1. Inspection</h3></div>
                    {revealedSteps.inspection ? <p className="text-sm font-bold text-[#5A3825] flex-1">{currentMode2Case?.ippaTable?.inspection}</p> : <button onClick={()=>setRevealedSteps(p=>({...p, inspection:true}))} className="flex-1 bg-[#FAD2CC] border-2 border-dashed border-[#5A3825] rounded-xl text-xs font-bold text-[#5A3825]">👁️ Inspect Chest</button>}
                  </div>

                  {/* Palpation (Partitioned) */}
                  <div className="bg-[#FFF5F5] border-3 border-[#5A3825] rounded-2xl p-3 flex flex-col gap-2">
                    <div className="flex items-center gap-2 border-b-2 border-[#FAD2CC] pb-2"><CategoryIcon category="Palpation" size={32} /> <h3 className="font-bold text-[#C85A5A]">2. Palpation</h3></div>
                    {/* Trachea */}
                    {revealedSteps.palpation_trachea ? <div className="bg-white p-2 border-2 border-[#5A3825] rounded-lg text-xs font-bold text-[#5A3825]"><span className="text-[#8C584C] text-[10px] block">Trachea:</span>{currentMode2Case?.ippaTable?.palpation_trachea}</div> : <button onClick={()=>setRevealedSteps(p=>({...p, palpation_trachea:true}))} className="py-2 bg-[#FEFCBF] border-2 border-dashed border-[#5A3825] rounded-lg text-xs font-bold text-[#5A3825]">✋ Palpate Trachea</button>}
                    {/* Expansion */}
                    {revealedSteps.palpation_expansion ? <div className="bg-white p-2 border-2 border-[#5A3825] rounded-lg text-xs font-bold text-[#5A3825]"><span className="text-[#8C584C] text-[10px] block">Chest Expansion:</span>{currentMode2Case?.ippaTable?.palpation_expansion}</div> : <button onClick={()=>setRevealedSteps(p=>({...p, palpation_expansion:true}))} className="py-2 bg-[#FEFCBF] border-2 border-dashed border-[#5A3825] rounded-lg text-xs font-bold text-[#5A3825]">✋ Chest Expansion</button>}
                    {/* Fremitus */}
                    {revealedSteps.palpation_fremitus ? <div className="bg-white p-2 border-2 border-[#5A3825] rounded-lg text-xs font-bold text-[#5A3825]"><span className="text-[#8C584C] text-[10px] block">Tactile Fremitus:</span>{currentMode2Case?.ippaTable?.palpation_fremitus}</div> : <button onClick={()=>setRevealedSteps(p=>({...p, palpation_fremitus:true}))} className="py-2 bg-[#FEFCBF] border-2 border-dashed border-[#5A3825] rounded-lg text-xs font-bold text-[#5A3825]">✋ Tactile Fremitus</button>}
                  </div>

                  {/* Percussion */}
                  <div className="bg-[#FFF5F5] border-3 border-[#5A3825] rounded-2xl p-3 flex flex-col">
                    <div className="flex items-center gap-2 border-b-2 border-[#FAD2CC] pb-2 mb-2"><CategoryIcon category="Percussion" size={32} /> <h3 className="font-bold text-[#C85A5A]">3. Percussion</h3></div>
                    {revealedSteps.percussion ? <p className="text-sm font-bold text-[#5A3825] flex-1">{currentMode2Case?.ippaTable?.percussion}</p> : <button onClick={()=>setRevealedSteps(p=>({...p, percussion:true}))} className="flex-1 bg-[#FFE4E6] border-2 border-dashed border-[#5A3825] rounded-xl text-xs font-bold text-[#5A3825]">👆 Percuss Chest</button>}
                  </div>

                  {/* Auscultation (Partitioned) */}
                  <div className="bg-[#FFF5F5] border-3 border-[#5A3825] rounded-2xl p-3 flex flex-col gap-2">
                    <div className="flex items-center gap-2 border-b-2 border-[#FAD2CC] pb-2"><CategoryIcon category="Auscultation" size={32} /> <h3 className="font-bold text-[#C85A5A]">4. Auscultation</h3></div>
                    {/* Breath Sounds */}
                    {revealedSteps.auscultation_breath ? <div className="bg-white p-2 border-2 border-[#5A3825] rounded-lg text-xs font-bold text-[#5A3825]"><span className="text-[#8C584C] text-[10px] block">Breath Sounds:</span>{currentMode2Case?.ippaTable?.auscultation_breath}</div> : <button onClick={()=>setRevealedSteps(p=>({...p, auscultation_breath:true}))} className="py-4 bg-[#E6FFFA] border-2 border-dashed border-[#5A3825] rounded-lg text-xs font-bold text-[#5A3825]">🩺 Listen (Breath)</button>}
                    {/* Vocal Resonance */}
                    {revealedSteps.auscultation_vocal ? <div className="bg-white p-2 border-2 border-[#5A3825] rounded-lg text-xs font-bold text-[#5A3825]"><span className="text-[#8C584C] text-[10px] block">Vocal Resonance:</span>{currentMode2Case?.ippaTable?.auscultation_vocal}</div> : <button onClick={()=>setRevealedSteps(p=>({...p, auscultation_vocal:true}))} className="py-4 bg-[#E6FFFA] border-2 border-dashed border-[#5A3825] rounded-lg text-xs font-bold text-[#5A3825]">🩺 Listen (Vocal)</button>}
                  </div>
                </div>
              </section>

              <section className="bg-[#FFFDF9] border-4 border-[#5A3825] rounded-3xl p-5 kawaii-shadow">
                <div className="flex items-center justify-between border-b-2 border-[#FAD2CC] pb-2.5 mb-4">
                  <span className="text-xs font-bold uppercase text-[#8C584C]">Select Diagnosis (Cards Flip to Reveal Pathology!)</span>
                </div>
                {/* Horizontal scroll on smaller screens, grid on large */}
                <div className="flex overflow-x-auto lg:grid lg:grid-cols-5 gap-4 pb-2 no-scrollbar">
                  {diseases.map((d) => {
                    const isGuessed = guessedDiseaseIds.includes(d.id);
                    const isCorrect = d.id === currentMode2Case.id;
                    let cardClass = 'bg-[#FFFDF9] border-[#5A3825] hover:-translate-y-1 kawaii-shadow-sm min-w-[200px] lg:min-w-0';
                    if (isGuessed && isCorrect) cardClass = 'kawaii-card-correct';
                    else if (isGuessed && !isCorrect) cardClass = 'kawaii-card-wrong';

                    return (
                      <button key={d.id} onClick={() => handleGuessDiseaseMode2(d)} className={`border-4 rounded-2xl p-3.5 flex flex-col justify-between items-center text-center transition-all cursor-pointer shrink-0 ${cardClass}`}>
                        <div className="w-full flex items-center justify-between mb-1">
                          <span className="text-[10px] font-bold uppercase px-2 py-0.5 rounded-full bg-[#FDF0F0] border border-[#5A3825]">{isGuessed ? 'Revealed!' : 'Mystery Lung'}</span>
                          {isGuessed && <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${isCorrect ? 'bg-[#68D391] text-[#22543D]' : 'bg-[#9B2C2C] text-white'}`}>{isCorrect ? '✓ +1' : '✗ -1'}</span>}
                        </div>
                        <div className="w-full my-1"><LungPathologyGraphic type={d.graphicType} customImageUrl={d.customImageUrl} mystery={!isGuessed} size="small" /></div>
                        <div className="mt-2"><h4 className="font-display font-bold text-sm text-[#5A3825] leading-tight">{d.name.split(' (')[0]}</h4></div>
                      </button>
                    );
                  })}
                </div>

                {mode2Feedback && (
                  <div className={`mt-4 rounded-2xl p-4 border-3 ${mode2Feedback.isCorrect ? 'bg-[#F0FFF4] border-[#68D391] text-[#22543D]' : 'bg-[#FFF5F5] border-[#9B2C2C] text-[#742A2A]'}`}>
                    <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
                      <div>
                        <h4 className="font-bold text-sm">{mode2Feedback.isCorrect ? `🎉 Correct Diagnosis! This patient has ${mode2Feedback.disease.name}` : `❌ Not quite! ${mode2Feedback.disease.name} does not match this IPPA pattern.`}</h4>
                        <p className="text-xs mt-1"><strong>Pathophysiology:</strong> {mode2Feedback.disease.pathophysiology}</p>
                      </div>
                      {mode2Feedback.isCorrect && <button onClick={() => startMode2Case()} className="bg-[#38A169] text-white text-xs font-bold px-4 py-2 rounded-xl border-2 border-[#22543D] shrink-0">Next Case ➔</button>}
                    </div>
                  </div>
                )}
              </section>
            </main>
          )}

          {/* ======================= PROFESSOR MODAL ======================= */}
          {showProfModal && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-[#FFFDF9] border-4 border-[#5A3825] rounded-3xl max-w-4xl w-full p-6 kawaii-shadow max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b-2 border-[#FAD2CC] pb-3 mb-4">
                  <h2 className="text-xl font-bold text-[#C85A5A] font-display">⚙️ Professor Editor</h2>
                  <button onClick={() => setShowProfModal(false)} className="bg-[#FFE4E6] text-[#5A3825] font-bold px-3 py-1.5 rounded-xl border-2 border-[#5A3825] text-sm">✕ Close</button>
                </div>

                {!profUnlocked ? (
                  <div className="py-8 text-center space-y-4">
                    <p className="text-sm font-bold">Enter PIN (1234) or click Unlock:</p>
                    <div className="flex justify-center gap-2">
                      <input type="password" value={pinInput} onChange={(e) => setPinInput(e.target.value)} placeholder="1234" className="border-2 border-[#5A3825] rounded-xl px-3 py-2 w-32 text-center" />
                      <button onClick={() => { if (pinInput === '1234' || pinInput === '') setProfUnlocked(true); }} className="bg-[#C85A5A] text-white font-bold px-4 py-2 rounded-xl border-2 border-[#5A3825]">🔓 Unlock</button>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-4">
                    <div className="flex justify-between bg-[#FDF0F0] p-2 rounded-2xl border-2 border-[#5A3825]">
                      <div className="flex gap-2">
                        <button onClick={() => setProfTab('diseases')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${profTab === 'diseases' ? 'bg-[#C85A5A] text-white' : 'text-[#5A3825]'}`}>Diseases</button>
                        <button onClick={() => setProfTab('findings')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${profTab === 'findings' ? 'bg-[#C85A5A] text-white' : 'text-[#5A3825]'}`}>Findings</button>
                      </div>
                      <div className="flex gap-2">
                        <button onClick={() => {
                          const payload = JSON.stringify({ diseases, findings }, null, 2);
                          const blob = new Blob([payload], { type: 'application/json' });
                          const url = URL.createObjectURL(blob);
                          const a = document.createElement('a'); a.href = url; a.download = 'game-data.json'; a.click();
                        }} className="bg-[#E6FFFA] text-xs font-bold px-3 py-1.5 rounded-xl border-2 border-[#5A3825]">⬇ Backup JSON</button>
                      </div>
                    </div>
                    
                    {profTab === 'diseases' && (
                      <div className="text-center py-10 bg-[#FFF5F5] border-2 border-[#5A3825] rounded-2xl">
                        <p className="font-bold text-[#5A3825] mb-2">Professor editing is functional but simplified in this HTML view.</p>
                        <p className="text-xs text-[#8C584C]">To edit the 10 diseases or findings permanently, edit the <code>DEFAULT_DISEASES</code> block directly inside the downloaded index.html file.</p>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
